name: Windows - pacote MSIX (teste)

# Manual: Actions > "Windows - pacote MSIX (teste)" > Run workflow.
# Gera o MSIX de teste, instala no runner, abre o aplicativo empacotado e roda o App Certification Kit.
# Nada daqui vai para a página de versões nem mexe no instalador (setup.exe).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
      OUT: ${{ github.workspace }}\msix-output
    steps:
      - uses: actions/checkout@v5

      - name: Montar o aplicativo (PyInstaller, sem testes)
        id: build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:OUT" | Out-Null
          & .\build\build.ps1 -CI
          exit $LASTEXITCODE

      - name: Gerar o pacote MSIX de teste
        id: pack
        shell: powershell
        run: |
          & .\build\msix.ps1 *>&1 | Tee-Object -FilePath "$env:OUT\msix.log"
          exit $LASTEXITCODE

      - name: Gerar o pacote da Store (sem assinatura, identidade do Partner Center)
        id: store
        if: always() && steps.pack.outcome == 'success'
        shell: powershell
        run: |
          & .\build\msix.ps1 -Store -IdentityName "ColorSoftware.PrumoPDF" `
            -Publisher "CN=14A65191-FC80-4E0D-8BDB-C2902164E3DC" -PublisherDisplayName "Color Software" `
            *>&1 | Tee-Object -FilePath "$env:OUT\msix-store.log"
          exit $LASTEXITCODE

      - name: Instalar e abrir o pacote
        id: smoke
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Import-Certificate -FilePath dist\msix\PrumoPDF_teste.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $msix = (Get-ChildItem dist\msix\*_teste.msix | Select-Object -First 1).FullName
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage -Name PrumoPDF.Teste
          "Instalado em: $($pkg.InstallLocation)" | Tee-Object -FilePath "$env:OUT\smoke.log"
          $report = Join-Path $env:RUNNER_TEMP "msix_selftest.json"
          Remove-Item $report -ErrorAction SilentlyContinue
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId PrumoPDF `
            -Command "$($pkg.InstallLocation)\PrumoPDF.exe" -Args "--self-test `"$report`""
          $end = (Get-Date).AddSeconds(180)
          while (-not (Test-Path $report) -and (Get-Date) -lt $end) { Start-Sleep -Seconds 3 }
          if (Test-Path $report) {
            Get-Content $report | Tee-Object -FilePath "$env:OUT\selftest.json"
          } else {
            "O aplicativo empacotado não gerou o relatório em 180 s." | Tee-Object -Append -FilePath "$env:OUT\smoke.log"
            exit 1
          }

          # OCR de verdade, com o Tesseract de dentro do pacote
          $work = Join-Path $env:RUNNER_TEMP "ocr_msix"
          New-Item -ItemType Directory -Force $work | Out-Null
          & .venv\Scripts\python.exe -c "import sys; sys.path.insert(0,'tests'); from pathlib import Path; from fixtures import scanned_pdf; scanned_pdf(Path(r'$work\scan.pdf'), 1)"
          $job = @{ input = "$work\scan.pdf"; output = "$work\out.pdf"; status_file = "$work\status.jsonl"; language = "por";
                    max_precision = $false; jobs = 2; deskew = $true; allow_signed = $false; save_txt = $false } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$work\job.json", $job, (New-Object System.Text.UTF8Encoding($false)))
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId PrumoPDF `
            -Command "$($pkg.InstallLocation)\PrumoPDF.exe" -Args "--ocr-worker `"$work\job.json`""
          $end = (Get-Date).AddSeconds(300)
          while (-not (Test-Path "$work\out.pdf") -and (Get-Date) -lt $end) { Start-Sleep -Seconds 3 }
          if (Test-Path "$work\status.jsonl") { Copy-Item "$work\status.jsonl" "$env:OUT\ocr-status.jsonl" }
          if (Test-Path "$work\out.pdf") { "OCR no pacote: OK" | Tee-Object -Append -FilePath "$env:OUT\smoke.log" }
          else { "OCR no pacote: o PDF de saída não apareceu em 300 s." | Tee-Object -Append -FilePath "$env:OUT\smoke.log"; exit 1 }

      - name: App Certification Kit (Store)
        id: cert
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          $msix = (Get-ChildItem dist\msix\*_teste.msix | Select-Object -First 1).FullName
          & $kit reset
          & $kit test -appxpackagepath $msix -reportoutputpath "$env:OUT\appcert-report.xml"
          "appcert exit code: $LASTEXITCODE" | Tee-Object -FilePath "$env:OUT\appcert.log"

      - name: Guardar os resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: msix-resultados
          path: |
            dist/msix/*.msix
            dist/msix/*.cer
            msix-output/**
            build/work/msix_stage/AppxManifest.xml
          if-no-files-found: warn
