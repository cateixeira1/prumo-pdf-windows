name: Windows - testar e gerar o instalador

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}\ci-output
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Gerar o aplicativo e o instalador (setup.exe)
        id: build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\logs", "$env:OUT\screenshots" | Out-Null
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 "$env:OUT\STATUS.txt"
          Start-Transcript -Path "$env:OUT\logs\build.log" | Out-Null
          & .\build\build.ps1 -CI
          $rc = $LASTEXITCODE
          Stop-Transcript | Out-Null
          exit $rc

      - name: Testes num Windows de verdade
        id: test
        if: always() && steps.build.outcome == 'success'
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          Start-Process -FilePath "build\redist\tesseract-setup.exe" -ArgumentList "/S" -Wait
          Copy-Item "tessdata\por.traineddata" "C:\Program Files\Tesseract-OCR\tessdata\" -Force
          $env:Path = "C:\Program Files\Tesseract-OCR;$env:Path"
          & uv pip install --python .venv\Scripts\python.exe pytest | Out-Null
          & .venv\Scripts\python.exe -m pytest -q tests *>&1 | Tee-Object -FilePath "$env:OUT\logs\tests.log"
          exit $LASTEXITCODE

      - name: Capturas de tela (Windows, fonte Segoe UI)
        id: shots
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $demo = Join-Path $env:RUNNER_TEMP "demo\Prumo PDF"
          foreach ($s in @("home", "all", "detail", "folder", "reader", "crop", "number", "lock")) {
            $argv = @("app\main.py", "--demo", "`"$demo`"", "--screen", $s, "--shot", "`"$env:OUT\screenshots\$s.png`"")
            $p = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "timeout: $s" }
          }
          Get-ChildItem "$env:OUT\screenshots"

      - name: Publicar resultados (branch windows-output)
        if: always()
        shell: powershell
        run: |
          "build=${{ steps.build.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          "test=${{ steps.test.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          "screenshots=${{ steps.shots.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          $setup = Get-ChildItem "dist\PrumoPDF_Setup_*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            & .venv\Scripts\python.exe build\ci_publish.py $setup.FullName "$env:OUT\setup"
            "setup=$($setup.Name)" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          }
          "done=$(Get-Date -Format o)" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          Set-Location $env:OUT
          git init -q -b windows-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI $env:GITHUB_SHA"
          git push -qf "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" windows-output

      - name: Publicar o instalador na página de versões
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem "dist\PrumoPDF_Setup_*.exe" | Select-Object -First 1
          gh release delete ultima-versao -y --cleanup-tag 2>$null
          gh release create ultima-versao $setup.FullName `
            --title "Prumo PDF para Windows (última versão)" `
            --notes "Baixe o $($setup.Name) e dê dois cliques para instalar. Gerado do commit $($env:GITHUB_SHA.Substring(0,7))." `
            --latest
