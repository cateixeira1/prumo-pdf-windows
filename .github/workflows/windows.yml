name: Windows - testar e gerar o instalador

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}\ci-output
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Gerar o aplicativo e o instalador (setup.exe)
        id: build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\logs", "$env:OUT\screenshots" | Out-Null
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 "$env:OUT\STATUS.txt"
          Start-Transcript -Path "$env:OUT\logs\build.log" | Out-Null
          & .\build\build.ps1 -CI
          $rc = $LASTEXITCODE
          Stop-Transcript | Out-Null
          exit $rc

      - name: Testes num Windows de verdade
        id: test
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          Start-Process -FilePath "build\redist\tesseract-setup.exe" -ArgumentList "/S" -Wait
          Copy-Item "tessdata\por.traineddata" "C:\Program Files\Tesseract-OCR\tessdata\" -Force
          $env:Path = "C:\Program Files\Tesseract-OCR;$env:Path"
          & uv pip install --python .venv\Scripts\python.exe pytest pytest-timeout | Out-Null
          # -v mostra cada teste ao começar; um teste parado por mais de 5 min mostra onde estava e encerra.
          # O resultado é o código de saída do pytest: com "Stop", qualquer linha na saída de erro (um aviso
          # do Qt ao fechar, por exemplo) parava o passo antes do fim e escondia o resto da mensagem.
          $ErrorActionPreference = "Continue"
          & .venv\Scripts\python.exe -m pytest -v -p no:cacheprovider --timeout=300 -o faulthandler_timeout=240 tests *>&1 | Tee-Object -FilePath "$env:OUT\logs\tests.log"
          $rc = $LASTEXITCODE
          $noise = Select-String -Path "$env:OUT\logs\tests.log" -Pattern "already deleted|Traceback" | Select-Object -First 5
          if ($noise) { Write-Output "::warning::Mensagens de erro na saída dos testes: $($noise -join ' | ')" }
          exit $rc

      - name: Medidas de tamanho e velocidade
        id: measure
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $out = "$env:OUT\logs"
          & .venv\Scripts\python.exe tools\size_report.py dist\PrumoPDF 45 *>&1 | Out-File -Encoding utf8 "$out\size.txt"
          Get-ChildItem dist\PrumoPDF_Setup_*.exe | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Out-File -Append -Encoding utf8 "$out\size.txt"
          Get-Content "$out\size.txt" -TotalCount 3 | Write-Host
          # Tempo de abertura do aplicativo já empacotado (janela principal desenhada), 6 vezes: a 1ª é "a frio"
          $times = @()
          $phases = Join-Path $env:TEMP "prumo_fases.txt"
          Remove-Item $phases -ErrorAction SilentlyContinue
          $env:PRUMO_BENCH = $phases
          1..6 | ForEach-Object {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process -FilePath "dist\PrumoPDF\PrumoPDF.exe" -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill() }
              $times += [math]::Round($sw.Elapsed.TotalSeconds, 2)
          }
          "abertura do PrumoPDF.exe (s), 6 execuções (a 1a é a frio): $($times -join ', ')" | Tee-Object -Append -FilePath "$out\size.txt" | Write-Host
          if (Test-Path $phases) {
              $txt = @("", "fases (última linha = execução quente):") + @(Get-Content $phases | Select-Object -Last 2)
              $txt | Out-File -Append -Encoding utf8 "$out\size.txt"
          }
          # Perfil do computador do CI e custo de desenhar/pintar uma página (antes x agora)
          "`n=== Computador e desenho das páginas ===" | Out-File -Append -Encoding utf8 "$out\size.txt"
          & .venv\Scripts\python.exe tools\render_bench.py *>&1 | Out-File -Append -Encoding utf8 "$out\size.txt"
          # Quem demora para importar na abertura real (Python solto)
          $p = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList @("-X", "importtime", "app\main.py") -RedirectStandardError "$out\importtime_raw.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Remove-Item Env:PRUMO_BENCH
          & .venv\Scripts\python.exe tools\importtime_report.py "$out\importtime_raw.txt" 35 *>&1 | Out-File -Encoding utf8 "$out\importtime.txt"
          Remove-Item "$out\importtime_raw.txt" -ErrorAction SilentlyContinue
          # Tesseract instalado (para decidir o que levar no instalador)
          "`n=== Tesseract instalado ===" | Out-File -Append -Encoding utf8 "$out\size.txt"
          if (Test-Path "build\redist\tesseract-setup.exe") { "tesseract-setup.exe: {0:N1} MB" -f ((Get-Item "build\redist\tesseract-setup.exe").Length / 1MB) | Out-File -Append -Encoding utf8 "$out\size.txt" }
          if (Test-Path "C:\Program Files\Tesseract-OCR") {
              & .venv\Scripts\python.exe tools\size_report.py "C:\Program Files\Tesseract-OCR" 25 *>&1 | Out-File -Append -Encoding utf8 "$out\size.txt"
          }

      - name: Capturas de tela (Windows, fonte Segoe UI)
        id: shots
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $demo = Join-Path $env:RUNNER_TEMP "demo\Prumo PDF"
          foreach ($s in @("home", "all", "detail", "folder", "reader", "readertext", "crop", "number", "sign", "lock")) {
            $argv = @("app\main.py", "--demo", "`"$demo`"", "--screen", $s, "--shot", "`"$env:OUT\screenshots\$s.png`"")
            $p = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "timeout: $s" }
          }
          Get-ChildItem "$env:OUT\screenshots"

      - name: Publicar resultados (branch windows-output)
        if: always()
        shell: powershell
        run: |
          "build=${{ steps.build.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          "test=${{ steps.test.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          "screenshots=${{ steps.shots.outcome }}" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          $setup = Get-ChildItem "dist\PrumoPDF_Setup_*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            & .venv\Scripts\python.exe build\ci_publish.py $setup.FullName "$env:OUT\setup"
            "setup=$($setup.Name)" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          }
          "done=$(Get-Date -Format o)" | Out-File -Append -Encoding utf8 "$env:OUT\STATUS.txt"
          Set-Location $env:OUT
          git init -q -b windows-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI $env:GITHUB_SHA"
          git push -qf "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" windows-output

      - name: Publicar o instalador na página de versões
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(ls dist/PrumoPDF_Setup_*.exe | head -1)
          # Na primeira vez ainda não existe versão anterior para apagar.
          gh release delete ultima-versao -y --cleanup-tag 2>/dev/null || true
          gh release create ultima-versao "$setup" \
            --target "$GITHUB_SHA" \
            --title "Prumo PDF para Windows (última versão)" \
            --notes "Baixe o $(basename "$setup") e dê dois cliques para instalar. Gerado do commit ${GITHUB_SHA::7}." \
            --latest
